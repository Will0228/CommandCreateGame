name: Simple Workflow

on: 
  push :

  workflow_dispatch: 
    inputs:
      CONFIGUREATION:
        description: '構成の選択'
        required: true
        default: Debug
        type: choice
        options:
          - Debug
          - Release
    
jobs:
  # 自作アクションと定義済みアクションテスト
  CreateActionJob:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/sample

  # 変数を使用する
  UseEnvJob:
    runs-on: ubuntu-latest

    steps:
      - uses: ./.github/actions/UseEnvJob
        with:
          witch: "魔法使いです"
    
    
